/**:
  ros__parameters:
    general:
      grab_resolution: "HD720"
      grab_frame_rate: 30
      pub_resolution: "NATIVE"
      pub_downscale_factor: 2.0
      publish_status: false

    video:
      publish_rgb: true
      publish_left_right: false
      publish_raw: false
      publish_gray: false
      publish_stereo: false

    depth:
      depth_mode: "NEURAL"
      publish_depth_map: false
      publish_depth_info: true
      publish_point_cloud: true
      publish_depth_confidence: true
      publish_disparity: false

    pos_tracking:
      pos_tracking_enabled: false
      publish_odom_pose: false
      publish_pose_cov: false
      publish_cam_path: false

    sensors:
      publish_imu: false
      publish_imu_raw: false
      publish_mag: false
      publish_baro: false
      publish_temp: false

    mapping:
      mapping_enabled: false
    object_detection:
      od_enabled: false
    body_tracking:
      bt_enabled: false
    stream_server:
      stream_enabled: false
